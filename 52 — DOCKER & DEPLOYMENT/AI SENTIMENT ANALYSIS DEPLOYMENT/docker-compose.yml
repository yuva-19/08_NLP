
services:

  sentiment-api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: sentiment-analysis-api

    ports:
      - "8000:8000"

    environment:
      - PYTHONUNBUFFERED=1

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    restart: unless-stopped


volumes:

  huggingface-cache:
